# Offline with Ollama.
#
#   ollama pull qwen3:8b && ollama pull qwen3:32b
#   omniharness --profiles examples/profiles/ollama.toml --profile ollama --preset quick "..."
#
# The openai provider talks to /v1/responses: this needs an Ollama version
# that implements it. Older versions only offer /v1/chat/completions, which the
# harness doesn't support yet.
# Ollama needs no key; without api_key_env the harness sends "EMPTY", never
# your OPENAI_API_KEY.

[profiles.ollama]
quick = { provider = "openai", model = "qwen3:8b", base_url = "http://localhost:11434/v1", price_input = 0, price_output = 0, description = "Qwen3 8B on Ollama" }
standard = { provider = "openai", model = "qwen3:32b", base_url = "http://localhost:11434/v1", price_input = 0, price_output = 0, description = "Qwen3 32B on Ollama" }
thorough = { provider = "openai", model = "qwen3:32b", base_url = "http://localhost:11434/v1", price_input = 0, price_output = 0, description = "Qwen3 32B on Ollama" }

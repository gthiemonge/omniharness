# Your own profiles and presets. A profiles file replaces the built-in profiles:
# only the profiles defined here exist, and each preset is complete (at least a
# model). Merging over the built-ins instead is a Python option:
# load_profiles(path, base=DEFAULT_PROFILES).
#
#   omniharness --profiles examples/profiles/reference.toml --list-profiles
#   AGENT_PROFILES=my-profiles.toml python examples/06_subagents.py . --worker-model auto
#   Agent(profiles=load_profiles("my-profiles.toml"), ...)
#
# Fields: model (required), max_turns, description, effort, and the endpoint:
#   openai: base_url, api_key_env, organization, price_input, price_output,
#           api ("auto" | "responses" | "chat": the wire format, default auto),
#           context_window (tokens: trim requests to fit; default: no trimming)
#   claude: base_url
# A preset with its own base_url never gets OPENAI_API_KEY: name the variable
# holding its key with api_key_env, or it sends the placeholder "EMPTY".

# Cheap tier on a self-hosted model (vLLM, llama.cpp, TGI, LM Studio, ...).
[openai.quick]
model = "Qwen/Qwen3-32B"
base_url = "http://vllm.internal:8000/v1"
api_key_env = "VLLM_API_KEY"
price_input = 0.10        # USD per 1M tokens, for cost reports
price_output = 0.30
description = "Self-hosted Qwen3 32B"

# A new preset, on another endpoint without authentication.
[openai.coder]
model = "qwen3-coder"
max_turns = 60
base_url = "http://vllm.internal:8001/v1"

# Cloud tiers, on OPENAI_BASE_URL or api.openai.com.
[openai.standard]
model = "gpt-6.1-sol"
description = "GPT-6.1 Sol"

[openai.thorough]
model = "gpt-6-astra"
max_turns = 75
description = "GPT-6 Astra"

# Claude models through a gateway:
# [claude.standard]
# model = "claude-sonnet-5-5"
# base_url = "https://llm-gateway.example.com/anthropic"

# ── Profiles: each preset names its provider ──────────────────────────────
#   omniharness --profiles my-profiles.toml --profile hybrid --model auto "..."

# A local model for the cheap tier, Claude for the others.
[profiles.hybrid]
quick = { provider = "openai", model = "qwen3-8b", base_url = "http://localhost:8080/v1" }
standard = { provider = "claude", model = "claude-sonnet-5-5" }
thorough = { provider = "claude", model = "claude-opus-5-5" }

# Local models only: an agent on this profile never contacts a cloud service.
[profiles.offline]
quick = { provider = "openai", model = "qwen3-8b", base_url = "http://localhost:8080/v1" }
standard = { provider = "openai", model = "qwen3-32b", base_url = "http://gpu-box:8000/v1" }
thorough = { provider = "openai", model = "qwen3-32b", base_url = "http://gpu-box:8000/v1" }

